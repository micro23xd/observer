# observer.tmux.conf — tmux tuned for running an agent TUI *nested* inside a host terminal
# (a plain terminal tab, or a launcher pane such as Superset's). The goal is to be
# invisible: the host draws the chrome, tmux just gives us an externally-addressable PTY
# so observer can `send-keys` into an idle session.
#
# Used by claude-steer.sh on a dedicated server (`tmux -L observer`), so none of this
# touches a user's normal tmux.

set -g status off                      # no status bar — the host owns the window chrome
set -g prefix None                     # don't shadow the agent's own keybindings…
unbind C-b                             # …and drop the default prefix entirely
set -g escape-time 0                   # no Esc delay — matters for TUI key handling
set -g mouse off                       # let the host terminal own mouse/selection/scroll
set -g history-limit 50000
set -g default-terminal "tmux-256color"
# Pass modified keys (CSI-u / extended keys) through to the agent TUI — without this, tmux
# swallows Shift+Enter, so Claude Code can't insert a newline. `extended-keys on` forwards
# them to the inner app; advertising `extkeys` for the OUTER terminal is what makes tmux
# request + receive them from the host terminal in the first place (the part that's easy to miss).
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features '*:extkeys'
set -g destroy-unattached off          # survive a transient detach
set -g remain-on-exit off              # when claude exits, the session ends (the host closes the tab)
set -g focus-events on
